app:
  window_name: "Qwen Grounded Tracker Double Camera 3090"
  log_interval_seconds: 1.0
  output_dir: "outputs"

qwen:
  model_path: "models/qwen/Qwen3-VL-2B-Instruct"
  device: "cuda"
  local_files_only: true
  max_new_tokens: 160
  max_time_seconds: 30
  min_visual_tokens: 128
  max_visual_tokens: 768
  minimum_box_area_ratio: 0.0005
  fallback_box:
    enabled: true
    after_failures: 1
    width_ratio: 0.25
    height_ratio: 0.35
    y_center: 0.50

tracking:
  backend: "csrt"
  identity_min_score: 0.32
  identity_bad_frames: 4
  reference_update_score: 0.78
  auto_reground: true
  auto_reground_after_seconds: 2.0
  hold_after_loss_seconds: 0.6
  template_match_threshold: 0.52

boundary:
  mode: "grabcut"
  update_interval_frames: 2
  grabcut_iterations: 2

prediction:
  enabled: true
  history_size: 5
  max_prediction_seconds: 0.35
  velocity_damping: 0.75
  max_velocity_px_per_second: 1200
  max_size_change_px_per_second: 600

obstacles:
  enabled: true
  model_path: "models/yolo/yolo11n-seg.pt"
  device: "0"
  image_size: 960
  confidence: 0.25
  frame_interval: 3
  safety_only: true
  report_clear_detections: false
  stop_labels:
    - person
    - car
    - motorcycle
    - bus
    - truck
    - bicycle
    - dog
  danger_zone:
    x1: 0.20
    y1: 0.42
    x2: 0.80
    y2: 1.00
  exclude_target_iou: 0.60

lidar:
  backend: "null"
  require_ready: false
  emergency_distance_m: 0.35
  slow_distance_m: 0.70

navigation:
  enabled: true
  center_x: 0.50
  center_tolerance: 0.06
  stop_area_ratio: 0.13
  too_close_area_ratio: 0.25
  linear_speed: 0.08
  backward_speed: 0.04
  angular_speed: 0.22

safety:
  stop_on_tracking_loss: true
  stop_on_yolo_obstacle: true
  emergency_stop_default: false

task:
  center_tolerance: 0.08
  target_reached_area_ratio: 0.11
  destination_reached_area_ratio: 0.13
  grasp_seconds: 1.2
  verify_grasp_seconds: 0.6
  release_seconds: 1.0
  verify_done_seconds: 0.6

stereo:
  layout: "side_by_side"
  baseline_mm: 120.0
  left_camera: "0"
  right_camera: "2"
  calibration_file: "configs/stereo_calibration.yaml"

