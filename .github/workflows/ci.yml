name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/dev.txt
      - run: python tools/project.py check
      - run: python tools/project.py test --suite smoke
      - run: python tools/project.py test --suite regression
