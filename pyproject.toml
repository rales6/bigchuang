[project]
name = "robot-car-workspace"
version = "0.1.0"
description = "Android, ESP32, mapping, semantic navigation, stereo grasping and task orchestration monorepo"
requires-python = ">=3.10"
readme = "README.md"

# This is a multi-component workspace, not one deployable wheel. Each service
# keeps its existing deployment/import boundary; see docs/architecture.md.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "robot", "firmware", "firmware/car", "simulation"]
addopts = "-ra"
norecursedirs = [".git", ".venv", "runtime", "apps", "hardware"]

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["firmware/car", ".venv", ".git"]
