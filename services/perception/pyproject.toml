[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-grounded-tracker"
version = "2.0.0"
description = "Windows prototype: Qwen3-VL target grounding, category-agnostic tracking, YOLO obstacle perception, and LiDAR placeholder"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "OpenAI generated project"}]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
